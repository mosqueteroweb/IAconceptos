site_name: IA de cero a modelo propio
site_description: "Curso de Inteligencia Artificial en dos partes: conceptos, historia y ética; y cómo usar, ampliar, adaptar y crear modelos de lenguaje."
site_author: MosqueteroWeb
site_url: https://mosqueteroweb.github.io/IAconceptos/
repo_url: https://github.com/mosqueteroweb/IAconceptos
repo_name: mosqueteroweb/IAconceptos
edit_uri: edit/main/docs/
copyright: '© 2026 <a href="https://github.com/mosqueteroweb">MosqueteroWeb</a> · <a href="https://creativecommons.org/licenses/by-sa/4.0/deed.es">CC BY-SA 4.0</a>'
theme:
  name: material
  language: es
  logo: img/logo_mosqueteroweb.png
  favicon: img/logo_mosqueteroweb.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle: {icon: material/weather-night, name: Modo oscuro}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle: {icon: material/weather-sunny, name: Modo claro}
  features:
    - navigation.sections
    - navigation.footer
    - navigation.top
    - navigation.indexes
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tooltips
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - sane_lists
  - def_list
  - toc: {permalink: true, title: En esta página}
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed: {alternate_style: true}
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex: {generic: true}
  - pymdownx.critic
  - pymdownx.mark
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.keys
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
extra_css:
  - stylesheets/extra.css
plugins:
  - search: {lang: es}
nav:
  - Inicio: index.md
  - "Primera parte: entender la IA":
      - Fundamentos:
          - 1. ¿Qué es la IA?: 01-que-es-la-ia.md
          - 2. Historia: 02-historia.md
          - 3. Tipos de IA: 03-tipos-de-ia.md
      - Cómo aprenden las máquinas:
          - 4. Machine Learning: 04-machine-learning.md
          - 5. Deep Learning y redes neuronales: 05-deep-learning.md
          - "6. Multimodalidad, la IA que ve y habla": 06-multimodalidad.md
      - Crear con IA:
          - 7. Herramientas para crear IA: 07-herramientas.md
          - 8. IA generativa: 08-ia-generativa.md
          - 9. Hardware necesario: 09-hardware.md
          - "Práctica: montaje de un equipo para IA": practicas/montaje.md
          - 10. Software necesario: 10-software.md
      - Sociedad:
          - 11. Ética y responsabilidad: 11-etica.md
  - "Segunda parte: usar y crear modelos":
      - Presentación: parte-2.md
      - Usar modelos:
          - "12. Inferencia: cómo responde un modelo": 12-inferencia.md
          - 13. Aplicaciones e ingeniería de prompts: 13-apps-prompts.md
          - "14. IA en tu ordenador: LM Studio y Ollama": 14-ia-local.md
          - "15. La API: modelos desde tus programas": 15-api.md
      - Ampliar modelos:
          - 16. Habilidades y conectores (MCP): 16-habilidades-mcp.md
          - 17. Agentes y orquestadores: 17-agentes.md
      - Adaptar modelos:
          - 18. Fine-tuning: 18-fine-tuning.md
          - 19. Cuantización: 19-cuantizacion.md
          - 20. Destilación: 20-destilacion.md
      - Crear modelos:
          - 21. Pre-entrenamiento: 21-pre-entrenamiento.md
          - 22. Crea tu propio modelo: 22-crear-llm.md
      - Prácticas:
          - Normas y lista de prácticas: practicas/segunda-parte.md
          - "13. El laboratorio de prompts": practicas/practica-13.md
          - "14. Tu laboratorio de IA local": practicas/practica-14.md
          - "16. Habilidades y conectores": practicas/practica-16.md
          - "17. Tu agente, tus APIs": practicas/practica-17.md
          - "18. Un modelo con estilo propio": practicas/practica-18.md
          - "19. Cuantizar y medir": practicas/practica-19.md
          - "20. Destila tu propio modelo": practicas/practica-20.md
          - "21. Tu nano-modelo": practicas/practica-21.md
          - "22. Proyecto final": practicas/practica-22.md
  - Glosario: glosario.md
  - Sobre este material: acerca.md
