<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 252' width='760' height='252' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif'><rect width='760' height='252' rx='14' fill='#ffffff'/><text x='380' y='34' font-size='16' fill='#1f2933' text-anchor='middle' font-weight='700' fill-opacity='1'>Espacio latente: trabajar con una versión comprimida de la imagen</text><rect x='24' y='70' width='150' height='80' rx='10' fill='#14918a' fill-opacity='0.14' stroke='#14918a' stroke-width='2'/><text x='99.0' y='107.0' font-size='15' fill='#1f2933' text-anchor='middle' font-weight='600' fill-opacity='1'>Imagen</text><text x='99.0' y='127.0' font-size='12.5' fill='#52606d' text-anchor='middle' font-weight='400' fill-opacity='1'>512 × 512 píxeles</text><text x='99' y='172' font-size='12.5' fill='#52606d' text-anchor='middle' font-weight='400' fill-opacity='1'>786 432 números</text><line x1='176' y1='110' x2='212' y2='110' stroke='#52606d' stroke-width='2.2'/><polygon points='212,110 202.8,113.9 202.8,106.1' fill='#52606d'/><rect x='216' y='80' width='110' height='60' rx='10' fill='#52606d' fill-opacity='0.14' stroke='#52606d' stroke-width='2'/><text x='271.0' y='115.0' font-size='14' fill='#1f2933' text-anchor='middle' font-weight='600' fill-opacity='1'>Comprime</text><line x1='328' y1='110' x2='364' y2='110' stroke='#52606d' stroke-width='2.2'/><polygon points='364,110 354.8,113.9 354.8,106.1' fill='#52606d'/><rect x='368' y='86' width='120' height='48' rx='10' fill='#7a5cc7' fill-opacity='0.14' stroke='#7a5cc7' stroke-width='2'/><text x='428.0' y='107.0' font-size='15' fill='#1f2933' text-anchor='middle' font-weight='600' fill-opacity='1'>Latente</text><text x='428.0' y='127.0' font-size='12.5' fill='#52606d' text-anchor='middle' font-weight='400' fill-opacity='1'>64 × 64</text><text x='428' y='172' font-size='12.5' fill='#52606d' text-anchor='middle' font-weight='400' fill-opacity='1'>16 384 números</text><line x1='490' y1='110' x2='526' y2='110' stroke='#52606d' stroke-width='2.2'/><polygon points='526,110 516.8,113.9 516.8,106.1' fill='#52606d'/><rect x='530' y='80' width='110' height='60' rx='10' fill='#52606d' fill-opacity='0.14' stroke='#52606d' stroke-width='2'/><text x='585.0' y='115.0' font-size='14' fill='#1f2933' text-anchor='middle' font-weight='600' fill-opacity='1'>Descomprime</text><line x1='642' y1='110' x2='678' y2='110' stroke='#52606d' stroke-width='2.2'/><polygon points='678,110 668.8,113.9 668.8,106.1' fill='#52606d'/><rect x='680' y='70' width='60' height='80' rx='10' fill='#14918a' fill-opacity='0.14' stroke='#14918a' stroke-width='2'/><text x='710.0' y='115.0' font-size='13' fill='#1f2933' text-anchor='middle' font-weight='600' fill-opacity='1'>Imagen</text><path d='M 386 86 C 386 64, 470 64, 470 86' stroke='#d98a1c' stroke-width='2' fill='none' stroke-dasharray='5 4'/><text x='428' y='52' font-size='12.5' fill='#d98a1c' text-anchor='middle' font-weight='700' fill-opacity='1'>la difusión se hace aquí</text><text x='380' y='212' font-size='13' fill='#52606d' text-anchor='middle' font-weight='400' fill-opacity='1'>Unas 50 veces menos números: cada paso de quitar ruido es mucho más rápido.</text><text x='380' y='232' font-size='13' fill='#52606d' text-anchor='middle' font-weight='400' fill-opacity='1'>Al final, la versión comprimida se «descomprime» en la imagen de tamaño completo.</text></svg>