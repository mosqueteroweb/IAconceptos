oke-dasharray='4 5' stroke-opacity='0.6'/><line x1='100' y1='135' x2='322' y2='135' stroke='#52606d' stroke-width='2.2'/><polygon points='322,135 312.8,138.9 312.8,131.1' fill='#52606d'/><text x='215.0' y='128' font-size='12' fill='#52606d' text-anchor='middle' font-weight='600'>1 · «¿Qué hora es en Tokio?»</text><line x1='330' y1='172' x2='562' y2='172' stroke='#3b6fd8' stroke-width='2.2'/><polygon points='562,172 552.8,175.9 552.8,168.1' fill='#3b6fd8'/><text x='450.0' y='165' font-size='12' fill='#3b6fd8' text-anchor='middle' font-weight='600'>2 · pregunta + lista de herramientas</text><line x1='570' y1='209' x2='338' y2='209' stroke='#7a5cc7' stroke-width='2.2'/><polygon points='338,209 347.2,205.1 347.2,212.9' fill='#7a5cc7'/><text x='450.0' y='202' font-size='12' fill='#7a5cc7' text-anchor='middle' font-weight='600'>3 · pide: get_time(«Asia/Tokyo»)</text><line x1='330' y1='246' x2='792' y2='246' stroke='#3b6fd8' stroke-width='2.2'/><polygon points='792,246 782.8,249.9 782.8,242.1' fill='#3b6fd8'/><text x='565.0' y='239' font-size='12' fill='#3b6fd8' text-anchor='middle' font-weight='600'>4 · la aplicación ejecuta la herramienta</text><line x1='800' y1='283' x2='338' y2='283' stroke='#14918a' stroke-width='2.2'/><polygon points='338,283 347.2,279.1 347.2,286.9' fill='#14918a'/><text x='565.0' y='276' font-size='12' fill='#14918a' text-anchor='middle' font-weight='600'>5 · resultado: 03:15</text><line x1='330' y1='320' x2='562' y2='320' stroke='#3b6fd8' stroke-width='2.2'/><polygon points='562,320 552.8,323.9 552.8,316.1' fill='#3b6fd8'/><text x='450.0' y='313' font-size='12' fill='#3b6fd8' text-anchor='middle' font-weight='600'>6 · le pasa el resultado</text><line x1='570' y1='357' x2='338' y2='357' stroke='#7a5cc7' stroke-width='2.2'/><polygon points='338,357 347.2,353.1 347.2,360.9' fill='#7a5cc7'/><text x='450.0' y='350' font-size='12' fill='#7a5cc7' text-anchor='middle' font-weight='600'>7 · «En Tokio son las 03:15»</text><line x1='330' y1='394' x2='108' y2