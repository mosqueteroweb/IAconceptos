<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 820 320' width='820' height='320' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif'><rect width='820' height='320' rx='14' fill='#ffffff'/><text x='410' y='34' font-size='17' fill='#1f2933' text-anchor='middle' font-weight='700'>Habilidades y conectores: dos formas de ampliar un modelo</text><rect x='300' y='130' width='220' height='80' rx='10' fill='#ffffff'/><rect x='300' y='130' width='220' height='80' rx='10' fill='#7a5cc7' fill-opacity='0.14' stroke='#7a5cc7' stroke-width='2'/><text x='410.0' y='166.0' font-size='16' fill='#1f2933' text-anchor='middle' font-weight='600'>Modelo / agente</text><text x='410.0' y='185.0' font-size='12' fill='#52606d' text-anchor='middle' font-weight='400'>razona y decide</text><rect x='20' y='70' width='230' height='200' rx='10' fill='#ffffff'/><rect x='20' y='70' width='230' height='200' rx='10' fill='#d98a1c' fill-opacity='0.14' stroke='#d98a1c' stroke-width='2'/><text x='135.0' y='175.0' font-size='15' fill='#1f2933' text-anchor='middle' font-weight='600'></text><text x='135' y='98' font-size='16' fill='#d98a1c' text-anchor='middle' font-weight='700'>Habilidad (Skill)</text><text x='135' y='120' font-size='12' fill='#52606d' text-anchor='middle' font-weight='400'>carpeta con SKILL.md</text><text x='40' y='152' font-size='12' fill='#1f2933' text-anchor='start' font-weight='400'>• instrucciones: «cómo se hace»</text><text x='40' y='178' font-size='12' fill='#1f2933' text-anchor='start' font-weight='400'>• plantillas y ejemplos</text><text x='40' y='204' font-size='12' fill='#1f2933' text-anchor='start' font-weight='400'>• scripts opcionales</text><text x='40' y='230' font-size='12' fill='#1f2933' text-anchor='start' font-weight='400'>• se carga solo cuando hace falta</text><rect x='570' y='70' width='230' height='200' rx='10' fill='#ffffff'/><rect x='570' y='70' width='230' height='200' rx='10' fill='#14918a' fill-opacity='0.14' stroke='#14918a' stroke-width='2'/><text x='685.0' y='175.0' font-size='15' fill='#1f2933' text-anchor='middle' font-weight='600'></text><text x='685' y='98' font-size='16' fill='#14918a' text-anchor='middle' font-weight='700'>Conector (MCP)</text><text x='685' y='120' font-size='12' fill='#52606d' text-anchor='middle' font-weight='400'>servidor con herramientas</text><text x='590' y='152' font-size='12' fill='#1f2933' text-anchor='start' font-weight='400'>• acceso a datos: Drive, correo…</text><text x='590' y='178' font-size='12' fill='#1f2933' text-anchor='start' font-weight='400'>• acciones: crear, enviar, buscar</text><text x='590' y='204' font-size='12' fill='#1f2933' text-anchor='start' font-weight='400'>• permisos de tu cuenta</text><text x='590' y='230' font-size='12' fill='#1f2933' text-anchor='start' font-weight='400'>• estándar abierto (2024)</text><line x1='250' y1='170' x2='300' y2='170' stroke='#d98a1c' stroke-width='2.2'/><polygon points='300,170 290.8,173.9 290.8,166.1' fill='#d98a1c'/><line x1='570' y1='170' x2='520' y2='170' stroke='#14918a' stroke-width='2.2'/><polygon points='520,170 529.2,166.1 529.2,173.9' fill='#14918a'/><text x='410' y='300' font-size='13' fill='#52606d' text-anchor='middle' font-weight='400'>La habilidad enseña el procedimiento; el conector da acceso a las herramientas. Se combinan.</text></svg>