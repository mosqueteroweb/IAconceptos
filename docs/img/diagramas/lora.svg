.25'/><line x1='60' y1='270' x2='280' y2='270' stroke='#3b6fd8' stroke-opacity='0.25'/><text x='170' y='175' font-size='34' fill='#3b6fd8' text-anchor='middle' font-weight='700'>W</text><text x='170' y='205' font-size='13' fill='#52606d' text-anchor='middle' font-weight='400'>pesos originales</text><text x='170' y='222' font-size='13' fill='#52606d' text-anchor='middle' font-weight='400'>(congelados)</text><text x='170' y='316' font-size='12' fill='#52606d' text-anchor='middle' font-weight='400'>4096 × 4096 ≈ 16,8 millones</text><text x='322' y='188' font-size='34' fill='#1f2933' text-anchor='middle' font-weight='700'>+</text><rect x='370' y='70' width='24' height='220' fill='#d98a1c' fill-opacity='0.3' stroke='#d98a1c' stroke-width='2'/><text x='382' y='312' font-size='18' fill='#d98a1c' text-anchor='middle' font-weight='700'>A</text><text x='420' y='188' font-size='26' fill='#1f2933' text-anchor='middle' font-weight='700'>×</text><rect x='446' y='168' width='220' height='24' fill='#d98a1c' fill-opacity='0.3' stroke='#d98a1c' stroke-width='2'/><text x='556' y='222' font-size='18' fill='#d98a1c' text-anchor='middle' font-weight='700'>B</text><text x='520' y='266' font-size='12' fill='#52606d' text-anchor='middle' font-weight='400'>rango r = 16: 2 × 4096 × 16</text><text x='520' y='284' font-size='12' fill='#d98a1c' text-anchor='middle' font-weight='600'>≈ 131 000 parámetros (0,8 %)</text><text x='720' y='175' font-size='30' fill='#1f2933' text-anchor='middle' font-weight='700'>=</text><text x='770' y='172' font-size='26' fill='#14918a' text-anchor='middle' font-weight='700'>W'</text><text x='770' y='194' font-size='12' fill='#52606d' text-anchor='middle' font-weight='400'>ajustado</text><text x='410' y='350' font-size='13' fill='#52606d' text-anchor='middle' font-weight='400'>Solo se entrenan A y B. El resultado es un «adaptador» de pocos MB que se suma al modelo original.</text></svg>