<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 346' width='760' height='346' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif'><rect width='760' height='346' rx='14' fill='#ffffff'/><text x='380' y='34' font-size='16' fill='#1f2933' text-anchor='middle' font-weight='700' fill-opacity='1'>La atención cambia el significado de una palabra según su contexto</text><rect x='30.0' y='120' width='37.2' height='36' rx='8' fill='#f3f5f8' fill-opacity='1' stroke='#9aa5b1'/><text x='48.6' y='143.0' font-size='14.5' fill='#1f2933' text-anchor='middle' font-weight='400' fill-opacity='1'>En</text><rect x='75.2' y='120' width='37.2' height='36' rx='8' fill='#f3f5f8' fill-opacity='1' stroke='#9aa5b1'/><text x='93.80000000000001' y='143.0' font-size='14.5' fill='#1f2933' text-anchor='middle' font-weight='400' fill-opacity='1'>el</text><rect x='120.4' y='120' width='71.6' height='36' rx='8' fill='#f3f5f8' fill-opacity='1' stroke='#9aa5b1'/><text x='156.2' y='143.0' font-size='14.5' fill='#1f2933' text-anchor='middle' font-weight='400' fill-opacity='1'>parque</text><rect x='200.0' y='120' width='37.2' height='36' rx='8' fill='#f3f5f8' fill-opacity='1' stroke='#9aa5b1'/><text x='218.6' y='143.0' font-size='14.5' fill='#1f2933' text-anchor='middle' font-weight='400' fill-opacity='1'>me</text><rect x='245.2' y='120' width='63.0' height='36' rx='8' fill='#f3f5f8' fill-opacity='1' stroke='#9aa5b1'/><text x='276.7' y='143.0' font-size='14.5' fill='#1f2933' text-anchor='middle' font-weight='400' fill-opacity='1'>senté</text><rect x='316.2' y='120' width='37.2' height='36' rx='8' fill='#f3f5f8' fill-opacity='1' stroke='#9aa5b1'/><text x='334.8' y='143.0' font-size='14.5' fill='#1f2933' text-anchor='middle' font-weight='400' fill-opacity='1'>en</text><rect x='361.4' y='120' width='37.2' height='36' rx='8' fill='#f3f5f8' fill-opacity='1' stroke='#9aa5b1'/><text x='380.0' y='143.0' font-size='14.5' fill='#1f2933' text-anchor='middle' font-weight='400' fill-opacity='1'>un</text><rect x='406.6' y='120' width='63.0' height='36' rx='8' fill='#d98a1c' fill-opacity='0.3' stroke='#d98a1c'/><text x='438.09999999999997' y='143.0' font-size='14.5' fill='#1f2933' text-anchor='middle' font-weight='700' fill-opacity='1'>banco</text><path d='M 438.1 118 Q 297.1 3.0 156.2 118' stroke='#d1495b' stroke-opacity='1.00' stroke-width='5.9' fill='none'/><path d='M 438.1 118 Q 357.4 42.7 276.7 118' stroke='#d1495b' stroke-opacity='0.84' stroke-width='4.8' fill='none'/><text x='530' y='144' font-size='16' fill='#14918a' text-anchor='start' font-weight='700' fill-opacity='1'>«banco» = asiento</text><rect x='30.0' y='238' width='54.4' height='36' rx='8' fill='#f3f5f8' fill-opacity='1' stroke='#9aa5b1'/><text x='57.2' y='261.0' font-size='14.5' fill='#1f2933' text-anchor='middle' font-weight='400' fill-opacity='1'>Para</text><rect x='92.4' y='238' width='63.0' height='36' rx='8' fill='#f3f5f8' fill-opacity='1' stroke='#9aa5b1'/><text x='123.9' y='261.0' font-size='14.5' fill='#1f2933' text-anchor='middle' font-weight='400' fill-opacity='1'>sacar</text><rect x='163.4' y='238' width='71.6' height='36' rx='8' fill='#f3f5f8' fill-opacity='1' stroke='#9aa5b1'/><text x='199.2' y='261.0' font-size='14.5' fill='#1f2933' text-anchor='middle' font-weight='400' fill-opacity='1'>dinero</text><rect x='243.0' y='238' width='45.8' height='36' rx='8' fill='#f3f5f8' fill-opacity='1' stroke='#9aa5b1'/><text x='265.9' y='261.0' font-size='14.5' fill='#1f2933' text-anchor='middle' font-weight='400' fill-opacity='1'>fui</text><rect x='296.8' y='238' width='37.2' height='36' rx='8' fill='#f3f5f8' fill-opacity='1' stroke='#9aa5b1'/><text x='315.40000000000003' y='261.0' font-size='14.5' fill='#1f2933' text-anchor='middle' font-weight='400' fill-opacity='1'>al</text><rect x='342.0' y='238' width='63.0' height='36' rx='8' fill='#d98a1c' fill-opacity='0.3' stroke='#d98a1c'/><text x='373.5' y='261.0' font-size='14.5' fill='#1f2933' text-anchor='middle' font-weight='700' fill-opacity='1'>banco</text><path d='M 373.5 236 Q 286.4 156.5 199.2 236' stroke='#d1495b' stroke-opacity='1.00' stroke-width='5.9' fill='none'/><path d='M 373.5 236 Q 248.7 131.6 123.9 236' stroke='#d1495b' stroke-opacity='0.74' stroke-width='4.1' fill='none'/><text x='530' y='262' font-size='16' fill='#7a5cc7' text-anchor='start' font-weight='700' fill-opacity='1'>«banco» = entidad bancaria</text><text x='380' y='306' font-size='13' fill='#52606d' text-anchor='middle' font-weight='400' fill-opacity='1'>Las líneas salen de «banco» hacia las palabras en las que más se fija (cuanto más gruesa, más atención).</text><text x='380' y='326' font-size='13' fill='#52606d' text-anchor='middle' font-weight='400' fill-opacity='1'>Su vector se mezcla con el de esas palabras: el modelo obtiene un «banco» distinto en cada frase.</text></svg>