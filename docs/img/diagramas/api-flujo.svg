font-size='13' fill='#7a5cc7' text-anchor='middle' font-weight='600'>Respuesta en JSON: texto generado + tokens usados</text><text x='410' y='230' font-size='13' fill='#52606d' text-anchor='middle' font-weight='400'>La API no recuerda nada entre peticiones: para conversar hay que reenviar el historial cada vez.</text></svg>