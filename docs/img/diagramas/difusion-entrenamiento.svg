<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 326' width='760' height='326' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif'><rect width='760' height='326' rx='14' fill='#ffffff'/><text x='380' y='34' font-size='16' fill='#1f2933' text-anchor='middle' font-weight='700' fill-opacity='1'>Entrenamiento: ensuciar una imagen y aprender a adivinar el ruido</text><rect x='30' y='62' width='210' height='64' rx='10' fill='#14918a' fill-opacity='0.14' stroke='#14918a' stroke-width='2'/><text x='135.0' y='91.0' font-size='15' fill='#1f2933' text-anchor='middle' font-weight='600' fill-opacity='1'>Imagen + descripción</text><text x='135.0' y='111.0' font-size='12.5' fill='#52606d' text-anchor='middle' font-weight='400' fill-opacity='1'>«una casa con tejado rojo»</text><line x1='242' y1='94' x2='282' y2='94' stroke='#52606d' stroke-width='2.2'/><polygon points='282,94 272.8,97.9 272.8,90.1' fill='#52606d'/><rect x='286' y='62' width='190' height='64' rx='10' fill='#52606d' fill-opacity='0.14' stroke='#52606d' stroke-width='2'/><text x='381.0' y='91.0' font-size='15' fill='#1f2933' text-anchor='middle' font-weight='600' fill-opacity='1'>Se le añade ruido</text><text x='381.0' y='111.0' font-size='12.5' fill='#52606d' text-anchor='middle' font-weight='400' fill-opacity='1'>una cantidad al azar</text><line x1='478' y1='94' x2='518' y2='94' stroke='#52606d' stroke-width='2.2'/><polygon points='518,94 508.8,97.9 508.8,90.1' fill='#52606d'/><rect x='522' y='62' width='210' height='64' rx='10' fill='#3b6fd8' fill-opacity='0.14' stroke='#3b6fd8' stroke-width='2'/><text x='627.0' y='91.0' font-size='15' fill='#1f2933' text-anchor='middle' font-weight='600' fill-opacity='1'>La red adivina el ruido</text><text x='627.0' y='111.0' font-size='12.5' fill='#52606d' text-anchor='middle' font-weight='400' fill-opacity='1'>con ayuda de la descripción</text><line x1='627' y1='128' x2='627' y2='178' stroke='#52606d' stroke-width='2.2'/><polygon points='627,178 623.1,168.8 630.9,168.8' fill='#52606d'/><rect x='522' y='182' width='210' height='64' rx='10' fill='#d1495b' fill-opacity='0.14' stroke='#d1495b' stroke-width='2'/><text x='627.0' y='211.0' font-size='15' fill='#1f2933' text-anchor='middle' font-weight='600' fill-opacity='1'>Se compara</text><text x='627.0' y='231.0' font-size='12.5' fill='#52606d' text-anchor='middle' font-weight='400' fill-opacity='1'>con el ruido que se echó</text><line x1='520' y1='214' x2='480' y2='214' stroke='#52606d' stroke-width='2.2'/><polygon points='480,214 489.2,210.1 489.2,217.9' fill='#52606d'/><rect x='286' y='182' width='190' height='64' rx='10' fill='#d1495b' fill-opacity='0.14' stroke='#d1495b' stroke-width='2'/><text x='381.0' y='211.0' font-size='15' fill='#1f2933' text-anchor='middle' font-weight='600' fill-opacity='1'>Error</text><text x='381.0' y='231.0' font-size='12.5' fill='#52606d' text-anchor='middle' font-weight='400' fill-opacity='1'>cuánto se ha equivocado</text><line x1='284' y1='214' x2='244' y2='214' stroke='#52606d' stroke-width='2.2'/><polygon points='244,214 253.2,210.1 253.2,217.9' fill='#52606d'/><rect x='30' y='182' width='210' height='64' rx='10' fill='#7a5cc7' fill-opacity='0.14' stroke='#7a5cc7' stroke-width='2'/><text x='135.0' y='211.0' font-size='15' fill='#1f2933' text-anchor='middle' font-weight='600' fill-opacity='1'>Se ajustan los pesos</text><text x='135.0' y='231.0' font-size='12.5' fill='#52606d' text-anchor='middle' font-weight='400' fill-opacity='1'>para equivocarse menos</text><text x='380' y='288' font-size='13' fill='#52606d' text-anchor='middle' font-weight='400' fill-opacity='1'>Se repite con millones de imágenes y niveles de ruido distintos. Al final, la red sabe</text><text x='380' y='308' font-size='13' fill='#52606d' text-anchor='middle' font-weight='400' fill-opacity='1'>«limpiar» un poco cualquier imagen con ruido, y sabe qué aspecto tiene lo que describe el texto.</text></svg>