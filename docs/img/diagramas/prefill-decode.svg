<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 820 262' width='820' height='262' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif'><rect width='820' height='262' rx='14' fill='#ffffff'/><text x='410' y='34' font-size='18' fill='#1f2933' text-anchor='middle' font-weight='700'>Las dos fases de la inferencia</text><rect x='40' y='70' width='230' height='60' rx='8' fill='#7a5cc7' fill-opacity='0.2' stroke='#7a5cc7' stroke-width='2'/><text x='155' y='96' font-size='14' fill='#1f2933' text-anchor='middle' font-weight='600'>Prefill: leer el prompt</text><text x='155' y='116' font-size='12' fill='#52606d' text-anchor='middle' font-weight='400'>todos los tokens a la vez</text><rect x='290' y='70' width='38' height='60' rx='6' fill='#d98a1c' fill-opacity='0.25' stroke='#d98a1c' stroke-width='2'/><text x='309' y='105' font-size='12' fill='#1f2933' text-anchor='middle' font-weight='400'>t1</text><rect x='336' y='70' width='38' height='60' rx='6' fill='#d98a1c' fill-opacity='0.25' stroke='#d98a1c' stroke-width='2'/><text x='355' y='105' font-size='12' fill='#1f2933' text-anchor='middle' font-weight='400'>t2</text><rect x='382' y='70' width='38' height='60' rx='6' fill='#d98a1c' fill-opacity='0.25' stroke='#d98a1c' stroke-width='2'/><text x='401' y='105' font-size='12' fill='#1f2933' text-anchor='middle' font-weight='400'>t3</text><rect x='428' y='70' width='38' height='60' rx='6' fill='#d98a1c' fill-opacity='0.25' stroke='#d98a1c' stroke-width='2'/><text x='447' y='105' font-size='12' fill='#1f2933' text-anchor='middle' font-weight='400'>t4</text><rect x='474' y='70' width='38' height='60' rx='6' fill='#d98a1c' fill-opacity='0.25' stroke='#d98a1c' stroke-width='2'/><text x='493' y='105' font-size='12' fill='#1f2933' text-anchor='middle' font-weight='400'>t5</text><rect x='520' y='70' width='38' height='60' rx='6' fill='#d98a1c' fill-opacity='0.25' stroke='#d98a1c' stroke-width='2'/><text x='539' y='105' font-size='12' fill='#1f2933' text-anchor='middle' font-weight='400'>t6</text><rect x='566' y='70' width='38' height='60' rx='6' fill='#d98a1c' fill-opacity='0.25' stroke='#d98a1c' stroke-width='2'/><text x='585' y='105' font-size='12' fill='#1f2933' text-anchor='middle' font-weight='400'>t7</text><rect x='612' y='70' width='38' height='60' rx='6' fill='#d98a1c' fill-opacity='0.25' stroke='#d98a1c' stroke-width='2'/><text x='631' y='105' font-size='12' fill='#1f2933' text-anchor='middle' font-weight='400'>t8</text><rect x='658' y='70' width='38' height='60' rx='6' fill='#d98a1c' fill-opacity='0.25' stroke='#d98a1c' stroke-width='2'/><text x='677' y='105' font-size='12' fill='#1f2933' text-anchor='middle' font-weight='400'>t9</text><rect x='704' y='70' width='38' height='60' rx='6' fill='#d98a1c' fill-opacity='0.25' stroke='#d98a1c' stroke-width='2'/><text x='723' y='105' font-size='12' fill='#1f2933' text-anchor='middle' font-weight='400'>t10</text><rect x='750' y='70' width='38' height='60' rx='6' fill='#d98a1c' fill-opacity='0.25' stroke='#d98a1c' stroke-width='2'/><text x='769' y='105' font-size='12' fill='#1f2933' text-anchor='middle' font-weight='400'>t11</text><text x='540' y='150' font-size='12' fill='#52606d' text-anchor='middle' font-weight='400'>Decodificación: un token cada vez (cada uno vuelve a entrar en el modelo)</text><line x1='40' y1='185' x2='270' y2='185' stroke='#7a5cc7' stroke-width='2.2'/><polygon points='270,185 260.8,188.9 260.8,181.1' fill='#7a5cc7'/><text x='155' y='205' font-size='13' fill='#7a5cc7' text-anchor='middle' font-weight='600'>Tiempo hasta el primer token (TTFT)</text><line x1='290' y1='185' x2='790' y2='185' stroke='#d98a1c' stroke-width='2.2'/><polygon points='790,185 780.8,188.9 780.8,181.1' fill='#d98a1c'/><text x='540' y='205' font-size='13' fill='#d98a1c' text-anchor='middle' font-weight='600'>Velocidad de generación: tokens por segundo (tok/s)</text><text x='410' y='244' font-size='13' fill='#52606d' text-anchor='middle' font-weight='400'>El prefill depende sobre todo de la potencia de cálculo; la decodificación, del ancho de banda de memoria.</text></svg>